[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textutils"
version = "0.1.0"
description = "Small utilities for common text operations."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Erwan Vangu" },
]
dependencies = []

[project.optional-dependencies]
dev = [
    "black>=24.0,<27.0",
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
include = ["textutils*"]
exclude = ["textutils.tests*", "textutils.*.tests*"]
namespaces = false

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["D", "E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["textutils"]

[tool.coverage.run]
branch = true
source = ["textutils"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

